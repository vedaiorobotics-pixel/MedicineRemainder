plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tabletreminder.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tabletreminder.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A fixed signing key, so a newer build installs over the old one
    // without losing your medicines and history.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
