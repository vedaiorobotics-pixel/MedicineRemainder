name: Build app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename the app file
        run: cp app/build/outputs/apk/debug/app-debug.apk TabletReminder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TabletReminder
          path: TabletReminder.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tablet Reminder (build ${{ github.run_number }})
          body: Download TabletReminder.apk below on your phone and install it.
          files: TabletReminder.apk
          make_latest: true
